<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Radial studio glow behind mic -->
  <circle cx="256" cy="240" r="180" fill="url(#glow)"/>

  <!-- Sound Waves (Left & Right) -->
  <path d="M 176 195 A 70 70 0 0 0 176 285" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
  <path d="M 140 160 A 120 120 0 0 0 140 320" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round" opacity="0.45"/>
  <path d="M 336 195 A 70 70 0 0 1 336 285" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
  <path d="M 372 160 A 120 120 0 0 1 372 320" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round" opacity="0.45"/>

  <!-- Mic Capsule Outer / Grill -->
  <g filter="url(#shadow)">
    <!-- Capsule Body -->
    <rect x="216" y="140" width="80" height="140" rx="40" fill="url(#redGrad)"/>
    <!-- Capsule Inner Mesh Lines -->
    <line x1="226" y1="180" x2="286" y2="180" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <line x1="226" y1="205" x2="286" y2="205" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <line x1="226" y1="230" x2="286" y2="230" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <circle cx="256" cy="160" r="6" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Mic Cradle / U-mount -->
  <path d="M 196 220 C 196 300, 316 300, 316 220" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>

  <!-- Vertical Stem -->
  <line x1="256" y1="298" x2="256" y2="356" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>

  <!-- Stand Base -->
  <line x1="200" y1="356" x2="312" y2="356" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>

  <!-- Live On-Air Indicator Dot -->
  <circle cx="360" cy="120" r="14" fill="#ef4444"/>
  <circle cx="360" cy="120" r="22" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.6"/>
</svg>
